[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "signalintel"
version = "0.1.0"
description = "SignalIntel: Real-time Multi-Stream Video, Audio, and OCR Intelligence Platform"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
    { name = "SignalIntel Engineering Team" }
]
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "faster-whisper>=1.0.0",
    "deep-translator>=1.11.4",
    "srt>=3.5.3",
    "litellm>=1.40.0",
    "opencv-python>=4.10.0",
    "Pillow>=10.0.0",
    "numpy>=1.26.0",
    "pydantic>=2.8.0",
    "httpx>=0.27.0",
    "ffmpeg-python>=0.2.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
    "black>=24.4.0",
]

[project.scripts]
signalintel-server = "services.main:app"

[tool.ruff]
line-length = 100
target-version = "py310"

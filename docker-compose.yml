version: '3.8'

services:
  # ============================================================================
  # 1. Qdrant Vector Database (Vector Storage & Multimodal Hybrid Search)
  # ============================================================================
  qdrant:
    image: qdrant/qdrant:v1.11.0
    container_name: signalintel-qdrant
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__SERVICE__GRPC_PORT=6334
    networks:
      - signalintel-network
    healthcheck:
      test: ["CMD-SHELL", "timeout 2 bash -c 'cat < /dev/null > /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # 2. SignalIntel Rust Brain & Omnichannel Gateway (Port 8080)
  # ============================================================================
  signalintel-brain:
    build:
      context: .
      dockerfile: docker/Dockerfile.rust
    container_name: signalintel-brain
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - RUST_LOG=info
      - QDRANT_URL=http://qdrant:6333
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
    depends_on:
      qdrant:
        condition: service_healthy
    networks:
      - signalintel-network

  # ============================================================================
  # 3. SignalIntel Python Senses & Media Pipeline (Port 8000)
  # ============================================================================
  signalintel-services:
    build:
      context: .
      dockerfile: docker/Dockerfile.python
    container_name: signalintel-services
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PORT=8000
      - SIGNALINTEL_BRAIN_URL=http://signalintel-brain:8080/api/v1/ingest
      - SIGNALINTEL_VISION_MODEL=${SIGNALINTEL_VISION_MODEL:-llava:7b}
      - OLLAMA_HOST=${OLLAMA_HOST:-http://host.docker.internal:11434}
    depends_on:
      - signalintel-brain
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - signalintel-network

  # ============================================================================
  # 4. SignalIntel Intelligence Console UI (Port 3000 -> Nginx 80)
  # ============================================================================
  signalintel-ui:
    build:
      context: .
      dockerfile: docker/Dockerfile.ui
    container_name: signalintel-ui
    restart: unless-stopped
    ports:
      - "3000:80"
    depends_on:
      - signalintel-services
      - signalintel-brain
    networks:
      - signalintel-network

networks:
  signalintel-network:
    driver: bridge
    name: signalintel-net

volumes:
  qdrant_data:
    name: signalintel-qdrant-data
